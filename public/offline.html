<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21103c">
  <title>ACADEMIA — Tidak ada koneksi</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font-family:system-ui,sans-serif}
    main{max-width:440px;padding:32px;border:1px solid #e5e7eb;border-radius:20px;background:#fff;box-shadow:0 12px 40px #21103c12;text-align:center}
    .brand{color:#432477;font-weight:800;letter-spacing:.12em}
    h1{font-size:1.5rem;margin:24px 0 8px}
    p{line-height:1.6;color:#64748b}
    button{margin-top:12px;border:0;border-radius:12px;padding:12px 18px;background:#7955d9;color:white;font-weight:700;font-size:1rem}
  </style>
</head>
<body>
  <main>
    <div class="brand">ACADEMIA</div>
    <h1>Belum terhubung ke internet</h1>
    <p>ACADEMIA memerlukan koneksi internet untuk masuk dan mengambil data dari Supabase. Sambungkan kembali, lalu muat ulang halaman.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
